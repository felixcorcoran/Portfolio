# Al cambiar los datos del perfil (o el diseño del CV), vuelve a generar el
# CV y el Resume en PDF y los sube. Vercel publica ese commit como cualquier
# otro, así que el botón «Currículum» del portfolio siempre baja la versión
# al día. El commit del bot no vuelve a lanzar esto (solo cambian los PDF).
name: Currículum

on:
  push:
    branches: [main]
    paths:
      - src/data/perfil.ts
      - cv/**
      - .github/workflows/cv.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cv
  cancel-in-progress: true

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generar los PDF
        run: node cv/cv.mjs
        env:
          CV_BROWSER: /usr/bin/google-chrome

      - name: Subirlos si han cambiado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cv-felix-corcoran.pdf public/resume-felix-corcoran.pdf
          if git diff --cached --quiet; then
            echo "Los PDF no han cambiado"
          else
            git commit -m "docs: CV y Resume regenerados desde perfil.ts"
            git push
          fi
